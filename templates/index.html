<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Chatbot (RAG + Llama 3.2 3B)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        space: {
                            950: '#030712',
                            900: '#0b132b',
                            800: '#1c2541',
                            700: '#3a506b',
                            400: '#5bc0be',
                        },
                        solar: {
                            400: '#ff9f1c',
                            500: '#efefef',
                            600: '#ff5400',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030712;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(11, 19, 43, 0.45);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 122, 0, 0.15);
        }

        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 122, 0, 0.25);
            border-radius: 999px;
        }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        .typing-dot {
            animation: typingBounce 1.2s infinite ease-in-out both;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center font-sans">

<div class="w-full max-w-2xl h-[85vh] glass-panel rounded-3xl flex flex-col overflow-hidden">

    <!-- HEADER -->
    <div class="px-5 py-4 border-b border-solar-500/20 flex justify-between items-center bg-space-900/40">
        <div>
            <h1 class="text-sm font-tech font-bold text-white">
                AI Support Chatbot <span class="text-solar-400">//</span> LangChain + RAG + Llama 3.2
            </h1>
            <p class="text-[10px] text-gray-400 font-mono">Local AI Assistant</p>
        </div>

        <span class="text-[10px] text-solar-400 border border-solar-500/30 px-2 py-1 rounded">
            ONLINE
        </span>
    </div>

    <!-- CHAT AREA -->
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scroll"></div>

    <!-- TYPING -->
    <div id="typing" class="hidden px-4 py-2 text-xs text-gray-400 font-mono">
        <span class="typing-dot inline-block w-2 h-2 bg-solar-500 rounded-full"></span>
        <span class="typing-dot inline-block w-2 h-2 bg-solar-500 rounded-full"></span>
        <span class="typing-dot inline-block w-2 h-2 bg-solar-500 rounded-full"></span>
        Thinking...
    </div>

    <!-- INPUT -->
    <div class="p-4 border-t border-solar-500/20 bg-space-900/30 flex gap-2">
        <input
            id="input"
            type="text"
            placeholder="Ask something..."
            class="flex-1 bg-transparent border border-gray-700 rounded-lg px-3 py-2 text-white font-mono focus:outline-none"
            onkeydown="if(event.key==='Enter') sendMessage()"
        />

        <button
            onclick="sendMessage()"
            class="bg-solar-500 hover:bg-solar-600 text-black px-4 py-2 rounded-lg font-bold"
        >
            Send
        </button>
    </div>
</div>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const typing = document.getElementById("typing");

function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = role === "user"
        ? "text-right"
        : "text-left";

    div.innerHTML = `
        <div class="inline-block px-3 py-2 rounded-lg max-w-[80%]
            ${role === "user"
                ? "bg-solar-500 text-black"
                : "bg-gray-800 text-white"}">
            ${text}
        </div>
    `;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    addMessage("user", msg);
    input.value = "";

    typing.classList.remove("hidden");

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message: msg,
                session_id: "user1"
            })
        });

        const data = await res.json();

        typing.classList.add("hidden");
        addMessage("bot", data.response || "No response");

    } catch (err) {
        typing.classList.add("hidden");
        addMessage("bot", "Error: backend not reachable");
    }
}

// welcome message
addMessage("bot", "RAG system online. Ask me about World Cup squads.");
</script>

</body>
</html>
